name: Delete old workflow runs

on:
  workflow_dispatch:

jobs:
  delete-old-workflow-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: update_list_by_api.yml

    steps:
      - run: gh workflow view "${WORKFLOW}"
#      - run: |
#          gh run list --workflow "${WORKFLOW}" --limit 20 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' \
#          | xargs -n 1 -I {} gh api -X DELETE repos/${REPOSITORY}/actions/runs/{}
      - run: |
          gh run list --workflow "${WORKFLOW}" --json databaseId,status,createdAt --jq '.[] | select(.status == "completed") | select(.createdAt < (now-( 3 * 86400 ) | strftime("%Y-%m-%dT%H-%M-%SZ") )) | .databaseId' \
          | xargs -n 1 -I {} gh api -X DELETE repos/${REPOSITORY}/actions/runs/{}
        env:
          REPOSITORY: ${{ github.repository }}